spring:
  datasource:
    url: jdbc:postgresql://150.158.1.8:5432/senol_db_dev
    username: postgres
    password: ${DB_PASSWORD:your-db-password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
  base-url: http://150.158.1.8:8080

# 腾讯云COS配置 - 开发环境
cos:
  secret-id: ${COS_SECRET_ID:your-secret-id}
  secret-key: ${COS_SECRET_KEY:your-secret-key}
  region: ap-shanghai
  bucket-name: senol-bucket-dev-1311837853
  domain: senol-bucket-dev-1311837853.cos.ap-shanghai.myqcloud.com

logging:
  level:
    com.senol: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
